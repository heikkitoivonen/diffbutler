name: CI

on:
  push:
    branches: ["**"] # Release tags run these checks through publish.yml.
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Validate the release tag and retain tested distributions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Release tag builds must not restore a cache that another workflow could write.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: make setup
      - name: Check release tag matches package version
        if: inputs.release
        shell: uv run --locked python {0}
        run: |
          import os
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"refs/tags/v{version}"
          if os.environ["GITHUB_REF"] != expected:
              sys.exit(f"Release ref must be {expected}; got {os.environ['GITHUB_REF']}")
      - run: make check
      - run: make smoke
      - run: make audit
        if: inputs.release && matrix.os == 'ubuntu-latest'
      - name: Retain tested release distributions
        if: inputs.release && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
