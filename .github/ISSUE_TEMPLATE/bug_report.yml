name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove tokens and private source from examples."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands and a small example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: DiffButler version/commit, OS, Python version, terminal, and agent version if relevant.
    validations:
      required: true
