# DiffButler configuration. Omitted options use their built-in defaults.
# No forge or reviewer is configured until you add one below.
forges = []
reviewers = []

[general]
# Omit for 60 seconds with authenticated accounts, 600 with any public account.
# poll_interval_s = 600 # Explicit override for all accounts.
max_concurrent_reviews = 2
# Omit workspace_root to follow $XDG_DATA_HOME/diffbutler/reviews
# (default ~/.local/share/diffbutler/reviews).
# workspace_root = "~/diffbutler-reviews"
# Shared bare repositories; default $XDG_DATA_HOME/diffbutler/repos.
# repository_root = "~/diffbutler-repos"
# Evict unused repositories after 30 days; active session pins never expire.
# repository_retention_days = 30
# Optional reconstructible snapshots; conversations remain in workspace_root.
# Use a new private directory, separate from the other managed roots.
# snapshot_root = "/tmp/diffbutler-snapshots-yourname"

[db]
auto_migrate = true
# Omit url to follow $XDG_DATA_HOME/diffbutler/diffbutler.db
# (default ~/.local/share/diffbutler/diffbutler.db).
# url = "sqlite+aiosqlite:///~/my-data/diffbutler.db"

[review]
findings_threshold = "minor" # blocking | important | minor | nit | question
min_confidence = 0.5
exclude_globs = ["**/*.lock", "**/vendor/**", "**/*.min.js", "**/generated/**"]
mode = "source_only"
checkout = "worktree" # Native reviews currently use pinned source snapshots.
# default_reviewer = "codex"
# prompt = "~/review-instructions.md"

[ui]
columns = ["number", "title", "author", "state"]
sort_by = "attention"
sort_desc = true
preview_pane = true
default_filter = "active"
# browser_command = ["firefox", "--new-tab"]

[ui.attention]
blocking = 100
important = 40
age_pressure_per_day = 5
size_penalty_per_100_lines = 2

[keys]
open_in_browser = ["o", "ctrl+o"]

[repos]
# Add per-repository settings, for example:
# [repos."acme/api"]
# enabled = true
# path = "~/src/acme/api"
# git_transport = "auto" # auto | https | ssh; remembers the last successful fetch.
# default_reviewer = "codex"
# prompt = "~/review-instructions.md"
# checkout = "mediated"

# Remove the top-level forges = [] before adding forge accounts:
# [[forges]]
# kind = "github"
# base_url = "https://api.github.com"
# token_env = "GITHUB_TOKEN" # Omit for public access (None); login is then required.
# include_team_requests = true
# repositories = [] # Empty means review requests from all accessible repositories.
# login = "your-login"

# Remove the top-level reviewers = [] before adding reviewers:
# [[reviewers]]
# id = "codex"
# kind = "cli"
# command = ["codex"]
# preset = "codex"
# timeout_s = 900
# parse = "json_envelope" # The Codex preset uses its fixed JSONL protocol.
# json_path = "result"
# stdin = "prompt"

# Claude Code can be configured alongside Codex; select with --reviewer claude
# or set review.default_reviewer = "claude" above.
# [[reviewers]]
# id = "claude"
# kind = "cli"
# command = ["claude"]
# preset = "claude"
