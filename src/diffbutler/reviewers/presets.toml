# Verified against installed codex-cli 0.98.0 help, 2026-09-16.
[codex]
version = "codex-cli 0.98.0"
background = ["-a", "never", "-s", "read-only", "exec", "--json", "--skip-git-repo-check", "-"]
background_resume = ["-a", "never", "-s", "read-only", "exec", "resume", "--json", "--skip-git-repo-check", "{session_id}", "-"]
foreground = ["-a", "on-request", "-s", "read-only", "resume", "{session_id}"]

# Verified against installed Claude Code 2.1.278 help, 2026-09-19.
[claude]
version = "2.1.278 (Claude Code)"
background = ["--print", "--output-format", "stream-json", "--verbose", "--safe-mode", "--restricted", "--strict-mcp-config", "--mcp-config", '{"mcpServers":{}}', "--tools", "Read,Glob,Grep", "--allowedTools", "Read,Glob,Grep", "--permission-mode", "dontAsk", "--permission-prompts", "none"]
background_resume = ["--print", "--output-format", "stream-json", "--verbose", "--safe-mode", "--restricted", "--strict-mcp-config", "--mcp-config", '{"mcpServers":{}}', "--tools", "Read,Glob,Grep", "--allowedTools", "Read,Glob,Grep", "--permission-mode", "dontAsk", "--permission-prompts", "none", "--resume", "{session_id}"]
foreground = ["--safe-mode", "--strict-mcp-config", "--mcp-config", '{"mcpServers":{}}', "--tools", "default", "--permission-mode", "manual", "--resume", "{session_id}"]
