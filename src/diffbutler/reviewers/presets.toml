# Native CLI arguments; command assembly is covered by offline acceptance tests.
[codex]
background = ["-a", "never", "-s", "read-only", "exec", "--json", "--skip-git-repo-check", "-"]
background_resume = ["-a", "never", "-s", "read-only", "exec", "resume", "--json", "--skip-git-repo-check", "{session_id}", "-"]
foreground = ["-a", "on-request", "resume", "{session_id}"]

# Bash uses native auto permission checks; do not blanket-allow it.
# Keep normal user configuration; override tools and permissions per launch mode.
[claude]
background = ["--print", "--output-format", "stream-json", "--verbose", "--tools", "Read,Glob,Grep,Bash", "--allowedTools", "Read,Glob,Grep", "--permission-mode", "auto", "--permission-prompts", "none"]
background_resume = ["--print", "--output-format", "stream-json", "--verbose", "--tools", "Read,Glob,Grep,Bash", "--allowedTools", "Read,Glob,Grep", "--permission-mode", "auto", "--permission-prompts", "none", "--resume", "{session_id}"]
foreground = ["--tools", "default", "--permission-mode", "auto", "--resume", "{session_id}"]
